# Self-hosted Reactive Resume for NextHire CV Tailoring (RGPD: local only).
# Full stack per the official v4 requirements: Postgres (app DB), MinIO
# (self-hosted S3-compatible storage — NOT a cloud service, stays on this
# machine/network), and headless Chrome (server-side PDF rendering).
#
# v4.4.6 has NO API-key concept — auth is cookie/JWT via POST /api/auth/login
# with the email+password below. cv_tailoring_service logs in with these
# credentials (RXRESUME_EMAIL / RXRESUME_PASSWORD in its .env) rather than an
# API key.
services:
  rxresume-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reactive_resume
    volumes:
      - rxresume_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rxresume-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    ports:
      # Exposed to the host: the app returns direct MinIO URLs to the browser
      # for downloading exported PDFs, so this must be reachable from outside
      # the compose network too (still local-only — 127.0.0.1, not public).
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: rxresume
      MINIO_ROOT_PASSWORD: rxresume-minio-secret
    volumes:
      - rxresume_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  rxresume-chrome:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      TOKEN: change-me-chrome
      HEALTH: "true"

  reactive-resume:
    image: amruthpillai/reactive-resume:v4.4.6 # PIN: confirm/replace with the exact v4 tag or digest you deploy (open item — see plan §14)
    restart: unless-stopped
    depends_on:
      rxresume-postgres:
        condition: service_healthy
      rxresume-minio:
        condition: service_healthy
      rxresume-chrome:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      # Must be the real, publicly-reachable MinIO endpoint — the app returns
      # "${STORAGE_URL}/<path>" directly to the browser, it does not proxy
      # storage requests through itself.
      STORAGE_URL: http://localhost:9000/default
      DATABASE_URL: postgresql://postgres:postgres@rxresume-postgres:5432/reactive_resume
      ACCESS_TOKEN_SECRET: change-me-access
      REFRESH_TOKEN_SECRET: change-me-refresh
      MAIL_FROM: noreply@localhost
      # Headless Chrome (PDF export)
      CHROME_URL: ws://rxresume-chrome:3000
      CHROME_TOKEN: change-me-chrome
      CHROME_IGNORE_HTTPS_ERRORS: "true"
      # Self-hosted S3-compatible storage (MinIO) — internal to this Docker
      # network, never reaches the public internet.
      STORAGE_ENDPOINT: rxresume-minio
      STORAGE_PORT: 9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: default
      STORAGE_ACCESS_KEY: rxresume
      STORAGE_SECRET_KEY: rxresume-minio-secret
      STORAGE_USE_SSL: "false"
      STORAGE_SKIP_BUCKET_CHECK: "false"
    volumes:
      - rxresume_data:/opt/uploads

volumes:
  rxresume_pg:
  rxresume_minio:
  rxresume_data:
