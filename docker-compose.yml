name: nexthire

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ai_recruiter}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - nexthire

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - nexthire

  node-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/${MONGODB_DATABASE:-ai_recruiter}
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ai_recruiter}
      DB_NAME: ${MONGODB_DATABASE:-ai_recruiter}
      MONGODB_DB_NAME: ${MONGODB_DATABASE:-ai_recruiter}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_FRONTEND_URLS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      RECOMMENDATION_SERVICE_URL: http://flask-ai:5001
      CV_PARSER_URL: http://flask-ai:5002
      QUIZ_SERVICE_URL: http://flask-ai:5003
      HIRING_MODEL_URL: http://flask-ai:5000
      INTERVIEW_SCORE_URL: http://flask-ai:7000
      SCHEDULING_SERVICE_URL: http://scheduling:5004
      INTERVIEW_AGENT_URL: http://interview-agent:8013
      SPEECH_STACK_URL: http://speech-stack:8012
      FACE_VERIFY_SERVICE_URL: http://face-verify:8011
      YOLO_SERVICE_URL: http://yolo:8001/detect-frame
      ANALYSIS_SERVICE_URL: http://analysis-api:8090
      CV_TAILORING_SERVICE_URL: http://cv-tailoring:8014
      VOICE_ENGINE_PYTHON: python3
      PYTHONPATH: /app/Backend:/app/Backend/server
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - node_uploads:/app/Backend/server/uploads
      - voice_recordings:/app/Backend/server/voice-recordings
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexthire

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:${FRONTEND_PORT:-5173}
        VITE_RXRESUME_URL: http://localhost:${RXRESUME_PORT:-3000}
        VITE_SPEECH_STACK_URL: http://localhost:${SPEECH_STACK_PORT:-8012}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      node-api:
        condition: service_started
    networks:
      - nexthire

  login:
    build:
      context: .
      dockerfile: docker/Dockerfile.login
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_LOGIN_PORT:-5174}:80"
    depends_on:
      node-api:
        condition: service_started
    networks:
      - nexthire

  flask-ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.flask-ai
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/${MONGODB_DATABASE:-ai_recruiter}
      MONGO_DB_NAME: ${MONGODB_DATABASE:-ai_recruiter}
      CLUSTERING_PORT: 5006
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nexthire

  scheduling:
    build:
      context: Backend/scheduling
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      SERVICE_PORT: 5004
      SERVICE_HOST: 0.0.0.0
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ai_recruiter}
      NODE_BACKEND_URL: http://node-api:3001
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "${SCHEDULING_SERVICE_PORT:-5004}:5004"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nexthire

  yolo:
    build:
      context: .
      dockerfile: docker/Dockerfile.yolo
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${YOLO_PORT:-8001}:8001"
    networks:
      - nexthire

  face-verify:
    build:
      context: .
      dockerfile: docker/Dockerfile.face-verify
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    ports:
      - "${FACE_VERIFY_PORT:-8011}:8011"
    networks:
      - nexthire

  speech-stack:
    build:
      context: .
      dockerfile: docker/Dockerfile.speech-stack
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      FW_DEVICE: ${FW_DEVICE:-cpu}
      FW_MODEL: ${FW_MODEL:-base}
      FW_TTS_PROVIDER: ${FW_TTS_PROVIDER:-edge}
    ports:
      - "${SPEECH_STACK_PORT:-8012}:8012"
    networks:
      - nexthire

  interview-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.interview-agent
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      AGENT_PORT: 8013
    ports:
      - "${INTERVIEW_AGENT_PORT:-8013}:8013"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexthire

  analysis-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.analysis
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGODB_DATABASE:-ai_recruiter}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: HS256
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
    ports:
      - "${ANALYSIS_SERVICE_PORT:-8090}:8090"
    volumes:
      - analysis_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexthire

  analysis-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.analysis-worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGODB_DATABASE:-ai_recruiter}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET_KEY:-change-me}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
    volumes:
      - analysis_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis-api:
        condition: service_started
    networks:
      - nexthire

  cv-tailoring:
    build:
      context: .
      dockerfile: docker/Dockerfile.cv-tailoring
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      PORT: 8014
      MONGO_URI: mongodb://mongo:27017/${MONGODB_DATABASE:-ai_recruiter}
      CV_PARSER_URL: http://flask-ai:5002
      RXRESUME_URL: http://reactive-resume:3000
    ports:
      - "${CV_TAILORING_PORT:-8014}:8014"
    depends_on:
      mongo:
        condition: service_healthy
      flask-ai:
        condition: service_started
    networks:
      - nexthire

  rxresume-postgres:
    profiles: ["cv-tailoring", "full"]
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RXRESUME_PG_PASSWORD:-postgres}
      POSTGRES_DB: reactive_resume
    volumes:
      - rxresume_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexthire

  rxresume-minio:
    profiles: ["cv-tailoring", "full"]
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data
    ports:
      - "${MINIO_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rxresume}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rxresume-minio-secret}
    volumes:
      - rxresume_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexthire

  rxresume-chrome:
    profiles: ["cv-tailoring", "full"]
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      TOKEN: ${RXRESUME_CHROME_TOKEN:-change-me-chrome}
      HEALTH: "true"
    networks:
      - nexthire

  reactive-resume:
    profiles: ["cv-tailoring", "full"]
    image: amruthpillai/reactive-resume:v4.4.6
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      rxresume-postgres:
        condition: service_healthy
      rxresume-minio:
        condition: service_healthy
      rxresume-chrome:
        condition: service_started
    ports:
      - "${RXRESUME_PORT:-3000}:3000"
    environment:
      PORT: 3000
      PUBLIC_URL: http://localhost:${RXRESUME_PORT:-3000}
      STORAGE_URL: http://localhost:${MINIO_PORT:-9000}/default
      DATABASE_URL: postgresql://postgres:${RXRESUME_PG_PASSWORD:-postgres}@rxresume-postgres:5432/reactive_resume
      ACCESS_TOKEN_SECRET: ${RXRESUME_ACCESS_TOKEN_SECRET:-change-me-access}
      REFRESH_TOKEN_SECRET: ${RXRESUME_REFRESH_TOKEN_SECRET:-change-me-refresh}
      MAIL_FROM: noreply@localhost
      CHROME_URL: ws://rxresume-chrome:3000
      CHROME_TOKEN: ${RXRESUME_CHROME_TOKEN:-change-me-chrome}
      CHROME_IGNORE_HTTPS_ERRORS: "true"
      STORAGE_ENDPOINT: rxresume-minio
      STORAGE_PORT: 9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: default
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-rxresume}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rxresume-minio-secret}
      STORAGE_USE_SSL: "false"
      STORAGE_SKIP_BUCKET_CHECK: "false"
    volumes:
      - rxresume_data:/opt/uploads
    networks:
      - nexthire

  analysis-worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.analysis-worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGODB_DATABASE:-ai_recruiter}
      REDIS_URL: redis://redis:6379/0
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - analysis_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      analysis-api:
        condition: service_started
    networks:
      - nexthire

volumes:
  mongo_data:
  redis_data:
  node_uploads:
  voice_recordings:
  analysis_uploads:
  rxresume_pg:
  rxresume_minio:
  rxresume_data:

networks:
  nexthire:
    driver: bridge
