apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-recruiter-api
  namespace: ai-recruiter
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-recruiter-api
  template:
    metadata:
      labels:
        app: ai-recruiter-api
    spec:
      containers:
        - name: api
          image: ai-recruiter/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: ai-recruiter-config
            - secretRef:
                name: ai-recruiter-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
