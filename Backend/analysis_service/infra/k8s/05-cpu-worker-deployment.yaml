apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-recruiter-worker-cpu
  namespace: ai-recruiter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-recruiter-worker-cpu
  template:
    metadata:
      labels:
        app: ai-recruiter-worker-cpu
    spec:
      nodeSelector:
        workload: cpu
      containers:
        - name: worker
          image: ai-recruiter/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "rq worker high default low --url ${REDIS_URL} --with-scheduler"]
          envFrom:
            - configMapRef:
                name: ai-recruiter-config
            - secretRef:
                name: ai-recruiter-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
